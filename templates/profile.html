{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
<div class="card mx-auto" style="max-width: 500px;">
<div class="card-body">

{% if user.profile_image %}
<img src="{{url_for('static',filename='uploads/'+user.profile_image)}}" width="150" height="150">
{% endif %}

<h1>Profile</h1>

<p>User ID: {{user.id}}</p>
<p>Username: {{user.username}} <a href="/edit-profile">Edit</a>|<a href="change-password">Change Password</a>|<a href="/delete-account">Delete Account</a> </p>
<p>Registered On: {{user.register_date}}</p>
</div>
</div>
</div>
{% endblock %}
